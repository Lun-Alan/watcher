name: watch

on:
  schedule:
    # 每 10 分鐘（GitHub 繁忙時可能遲幾分鐘）。private repo 要改做 "*/30 * * * *"，詳情睇 README
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: watcher/requirements.txt

      - run: pip install -r watcher/requirements.txt

      - name: Install browser (only when a js item exists)
        run: |
          if grep -qE '^\s*js:\s*true' watcher/watchlist.yaml; then
            python -m playwright install --with-deps chromium
          fi

      - name: Check
        run: python watcher/watch.py check
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}

      - name: Save state
        run: |
          git config user.name "watch-bot"
          git config user.email "watch-bot@users.noreply.github.com"
          git add watcher/state.json
          if ! git diff --cached --quiet; then
            git commit -m "update state [skip ci]"
            git pull --rebase
            git push
          fi
